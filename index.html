<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OpenDoor 2D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="coinHud"><span class="coinIcon">🪙</span><span id="coinCount">0</span></div>
  <div class="healthHud"><div id="healthBar"></div></div>
  <div class="batteryHud"><div id="batteryBar"></div></div>
  <div class="itemBar">
    <div class="itemSlot active" title="Toggle flashlight">
      <span class="flashlightIcon">🔦</span>
      <span id="flashlightState">USED</span>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
